# The edge. Everything a browser or curl sends enters here.
#
# Its one job beyond routing is to give each request a correlation id, so the
# four processes a single request crosses can be found in the logs by one value
# rather than by comparing timestamps - which drifts between hosts and is exactly
# the thing not to correlate on.
#
# $request_id is generated by nginx per request. $http_x_request_id is whatever
# the caller sent. A caller-supplied id is honoured so a client can correlate its
# own request with ours, but only when it looks safe: anything with a newline or
# an escape sequence in it would be a client writing arbitrary lines into our
# logs, so that case falls back to a fresh id.
#
# The services do the same check independently. This is the normal source; that is
# the backstop for requests that reach a service directly, which is the tests.

upstream workspace_service   { server workspace-service:3001;   keepalive 16; }
upstream user_service        { server user-service:3002;        keepalive 16; }
upstream stage_service       { server stage-service:3003;       keepalive 16; }
upstream opportunity_service { server opportunity-service:3004; keepalive 16; }
upstream transition_service  { server transition-service:3005;  keepalive 16; }

# $request_id is 32 hex chars. Anything else from a caller is not a pattern we
# would have generated, so it is dropped and $request_id is used instead.
map $http_x_request_id $correlation_id {
    "~^[A-Za-z0-9._:-]{1,64}$" $http_x_request_id;
    default                    $request_id;
}

server {
    listen 18080;
    server_name _;

    # Small enough that a slow client cannot hold a connection open indefinitely,
    # large enough for a normal page of assets.
    client_max_body_size 1m;

    location / {
        proxy_pass         http://transition_service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        proxy_set_header   X-Request-Id      $correlation_id;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Long enough for a 50,000 record submission, which is measured at
        # seconds rather than milliseconds. Shorter than this and the edge would
        # cut off a request the service is still legitimately working on.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # The five services keep their own ports, for direct access from the tests
    # and for `docker compose exec`. The proxy is the public door, not the only
    # one - so a service that is only reachable through it cannot be tested
    # without standing the whole stack up.
    location = /_health { return 200 "ok\n"; }
}
