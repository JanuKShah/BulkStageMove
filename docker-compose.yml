name: bulk-stage-move

# Four services plus a shared Postgres. The services are separate processes with
# real HTTP boundaries, but they share one schema - see the note in
# src/shared/database/database.service.ts for why the composite foreign keys that
# enforce tenant isolation require it.
#
# Startup order is enforced, not hoped for: the `migrate` job runs to completion
# first, and only then do the services start. Migrations are idempotent, so this
# is safe on every `up`.
#
# Seeding is deliberately NOT automatic - it truncates, and `up` should not be
# destructive. Use `npm run verify` for the full documented flow.

x-db-env: &db-env
  DATABASE_URL: postgres://app:app_dev_password@postgres:5432/bulk_stage_move
  # 6 processes x 10 = 60 against max_connections 100. Raise with care.
  PG_POOL_MAX: 10

x-service-base: &service-base
  build:
    context: .
    target: runtime
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
  restart: unless-stopped
  environment: *db-env

x-healthcheck: &healthcheck
  # Readiness, not liveness: a database blip should stop traffic reaching this
  # instance, not cause a restart loop across all four services.
  test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:PORT/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 5s
  retries: 5
  # migrations must land before the first probe is meaningful
  start_period: 20s

services:
  migrate:
    build:
      context: .
      target: migrate
    container_name: bsm-migrate
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  workspace-service:
    <<: *service-base
    container_name: bsm-workspace
    command: ["node", "dist/apps/workspace-service/main.js"]
    environment:
      <<: *db-env
      PORT: 3001
      PG_APP_NAME: workspace-service
    ports:
      - '3001:3001'
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  user-service:
    <<: *service-base
    container_name: bsm-user
    command: ["node", "dist/apps/user-service/main.js"]
    environment:
      <<: *db-env
      PORT: 3002
      PG_APP_NAME: user-service
    ports:
      - '3002:3002'
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  stage-service:
    <<: *service-base
    container_name: bsm-stage
    command: ["node", "dist/apps/stage-service/main.js"]
    environment:
      <<: *db-env
      PORT: 3003
      PG_APP_NAME: stage-service
    ports:
      - '3003:3003'
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3003/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  opportunity-service:
    <<: *service-base
    container_name: bsm-opportunity
    command: ["node", "dist/apps/opportunity-service/main.js"]
    environment:
      <<: *db-env
      PORT: 3004
      PG_APP_NAME: opportunity-service
      STAGE_SERVICE_URL: http://stage-service:3003
      USER_SERVICE_URL: http://user-service:3002
      WORKSPACE_SERVICE_URL: http://workspace-service:3001
    ports:
      - '3004:3004'
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3004/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  transition-service:
    <<: *service-base
    container_name: bsm-transition
    command: ["node", "dist/apps/transition-service/main.js"]
    environment:
      <<: *db-env
      PORT: 3005
      PG_APP_NAME: transition-service
      STAGE_SERVICE_URL: http://stage-service:3003
      USER_SERVICE_URL: http://user-service:3002
      WORKSPACE_SERVICE_URL: http://workspace-service:3001
      RABBITMQ_URL: amqp://app:app_dev_password@rabbitmq:5672/%2f
    ports:
      - '3005:3005'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3005/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  # Consumes batches and writes them to the database. No HTTP surface and no
  # health endpoint, so readiness is the consumer having subscribed - a process
  # that cannot reach the broker exits and is restarted.
  worker-service:
    build:
      context: .
      target: runtime
    container_name: bsm-worker
    command: ["node", "dist/apps/worker-service/main.js"]
    environment:
      <<: *db-env
      RABBITMQ_URL: amqp://app:app_dev_password@rabbitmq:5672/%2f
      PG_APP_NAME: worker-service
      # 12 consumers, matched to the 12 logical cores. Measured, not guessed.
      #
      # A second queue would add nothing: consumers on a single queue already
      # share the work round-robin, so extra queues only add a second thing to
      # keep in balance - and if one queue's worker is slow, everything routed to
      # it backs up while the others idle.
      #
      # The evidence is the time per batch, which stays flat from 4 to 12
      # consumers (0.41s to 0.44s) while throughput rises 2.8x. Each batch does
      # 1,000 opportunity updates and 1,000 transition inserts, so the work is
      # compute-bound rather than queue-bound and matching consumers to cores is
      # the lever that matters. Oversubscribing past the core count is not free.
      #
      # A tuning value, not a constant: re-measure on other hardware.
      RABBITMQ_CONSUMER_CONCURRENCY: 12
      # Must rise with the consumer count. processBatch holds one connection for
      # the whole batch - the advisory lock is session-scoped - so 12 consumers on
      # the default pool of 10 would leave 2 of them blocked waiting for a
      # connection and the real parallelism would be 10.
      PG_POOL_MAX: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: bsm-postgres
    environment:
      POSTGRES_DB: bulk_stage_move
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d bulk_stage_move']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: bsm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app_dev_password
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      # rabbitmq-diagnostics is the broker's own readiness check; a TCP connect
      # succeeds while the node is still booting and would gate too early.
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  # The edge. Gives every request a correlation id, forwarded to the services as
  # X-Request-Id and echoed on the response.
  #
  # The services keep their own published ports alongside this. The proxy is the
  # public door, not the only one, so a test can still reach a service directly
  # without standing the proxy up - which matters because the fast suites are the
  # ones a developer waits on.
  nginx:
    image: nginx:1-alpine
    container_name: bsm-nginx
    ports:
      - '8080:8080'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      transition-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  rabbitdata:

